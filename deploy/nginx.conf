# Example nginx configuration for hosting Research Lab Manager.
#
# 1. Build the app:   npm run build
# 2. Copy dist/* to:  /var/www/researchlabmanager
# 3. Drop this file in /etc/nginx/sites-available/ (adjust paths/server_name),
#    symlink it into sites-enabled/, then `nginx -t && systemctl reload nginx`.
#
# The two things that matter:
#   - serve the static files from dist/
#   - reverse-proxy /biblio-api/ to https://biblio.ugent.be/ so the
#     Publications page can fetch from Biblio UGent without hitting CORS.

server {
    listen 80;
    # listen 443 ssl;  # recommended — terminate TLS here (e.g. with certbot)
    server_name your-lab.example.com;

    root /var/www/researchlabmanager;
    index index.html;

    # --- UGent Biblio API reverse proxy -------------------------------------
    # The Vue app fetches /biblio-api/person/<id>/publication/export?format=json
    # which is forwarded to https://biblio.ugent.be/person/<id>/...
    location /biblio-api/ {
        proxy_pass https://biblio.ugent.be/;
        proxy_set_header Host biblio.ugent.be;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;          # send SNI to the upstream TLS server
        proxy_read_timeout 30s;
    }

    # --- Static app ---------------------------------------------------------
    # Hash-based routing (/#/team, /#/publications, ...) means every URL path
    # resolves to index.html; no special SPA history rewrite is required.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
