# nginx config used inside the Docker image (see Dockerfile).
# Serves the built static files and reverse-proxies the UGent Biblio API.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # UGent Biblio API reverse proxy — lets the Publications page fetch
    # publications without running into browser CORS restrictions.
    location /biblio-api/ {
        proxy_pass https://biblio.ugent.be/;
        proxy_set_header Host biblio.ugent.be;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_read_timeout 30s;
    }

    # Hash-based routing means every path resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
